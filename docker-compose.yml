services:
  # ----------------------------
  # PHP - Laravel backend
  # ----------------------------
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: app-activities-app
    volumes:
      - ./:/var/www/html
    networks:
      - app-activities
    depends_on:
      - mysql
      - redis
      - meilisearch

  # ----------------------------
  # Nginx - Servidor Web
  # ----------------------------
  nginx:
    image: nginx:alpine
    container_name: app-activities-nginx
    ports:
      - "8080:80" # ⚠️ 8080 para não conflitar com o Valet (que usa 80)
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-activities

  # ----------------------------
  # MySQL
  # ----------------------------
  mysql:
    image: mysql:8.0
    container_name: app-activities-mysql
    restart: always
    ports:
      - "3307:3306" # ⚠️ 3307 para não conflitar com MySQL local
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-activities

  # ----------------------------
  # Redis
  # ----------------------------
  redis:
    image: redis:alpine
    container_name: app-activities-redis
    ports:
      - "6380:6379" # ⚠️ 6380 para evitar conflito com Redis local
    networks:
      - app-activities

  # ----------------------------
  # Node (para build e Vite)
  # ----------------------------
  node:
    image: node:22.20
    container_name: app-activities-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5174:5173" # ⚠️ Vite (5173 é padrão, usamos 5174 p/ evitar conflito local)
    command: >
      sh -c "npm install && npm run dev"
    networks:
      - app-activities

  # ----------------------------
  # Meilisearch
  # ----------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: app-activities-meilisearch
    ports:
      - "7701:7700" # ⚠️ 7701 para não conflitar com possível instância local
    environment:
      MEILI_MASTER_KEY: "masterKey"
    volumes:
      - meili_data:/meili_data
    networks:
      - app-activities

# ----------------------------
# Volumes persistentes
# ----------------------------
volumes:
  mysql_data:
  meili_data:

# ----------------------------
# Network compartilhada
# ----------------------------
networks:
  app-activities:
    name: app-activities
    driver: bridge
