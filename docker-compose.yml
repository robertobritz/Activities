services:
  # ----------------------------
  # PHP - Laravel backend
  # ----------------------------
  app:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: app-activities-app
    volumes:
      - ./:/var/www/html
    networks:
      - app-activities
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "artisan", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------
  # Nginx - Servidor Web
  # ----------------------------
  nginx:
    image: nginx:1.24-alpine
    container_name: app-activities-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-activities

  # ----------------------------
  # MySQL
  # ----------------------------
  mysql:
    image: mysql:8.0
    container_name: app-activities-mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-activities
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ----------------------------
  # Redis
  # ----------------------------
  redis:
    image: redis:7-alpine
    container_name: app-activities-redis
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - app-activities
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ----------------------------
  # Node (para build e Vite) - ATUALIZADO
  # ----------------------------
  node:
    image: node:22.20-alpine
    container_name: app-activities-node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    ports:
      - "5174:5173"
    command: >
      sh -c "npm install && npm run dev"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-activities

  # ----------------------------
  # Meilisearch
  # ----------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: app-activities-meilisearch
    ports:
      - "7701:7700"
    environment:
      MEILI_MASTER_KEY: "masterKey"
      MEILI_ENV: development
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped
    networks:
      - app-activities
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 3

# ----------------------------
# Volumes persistentes
# ----------------------------
volumes:
  mysql_data:
  meili_data:
  node_modules:

# ----------------------------
# Network compartilhada
# ----------------------------
networks:
  app-activities:
    name: app-activities
    driver: bridge
